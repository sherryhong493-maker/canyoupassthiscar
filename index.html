<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --gray1: #e0e0d8;
    --gray2: #b0b0a8;
    --gray3: #606058;
    --border: 2px solid #0a0a0a;
    --border-thin: 1px solid #0a0a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  html { height: 100%; }

  body {
    background: var(--white);
    color: var(--black);
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.018) 3px,
      rgba(0,0,0,0.018) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  #app {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    min-height: 100dvh;
    border-left: var(--border);
    border-right: var(--border);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  @media (max-width: 440px) {
    #app { border-left: none; border-right: none; }
  }

  .header {
    border-bottom: var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: stretch;
  }

  .round-counter {
    font-size: 8px;
    padding: 12px 14px;
    line-height: 1.7;
    border-right: var(--border);
    color: var(--gray3);
  }

  .round-counter b {
    color: var(--black);
    display: block;
    font-size: 11px;
    margin-bottom: 2px;
  }

  .lang-toggle { display: flex; }

  .lang-btn {
    background: none;
    border: none;
    border-left: var(--border-thin);
    color: var(--gray2);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 0 12px;
    cursor: crosshair;
  }

  .lang-btn.active { background: var(--black); color: var(--white); }
  .lang-btn:first-child { border-left: var(--border); }

  .progress-track {
    border-bottom: var(--border);
    height: 12px;
    background: var(--white);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--black);
    transition: width 0.25s steps(15);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to right,
      transparent 0, transparent 9px,
      var(--white) 9px, var(--white) 10px
    );
    opacity: 0.25;
  }

  .main { flex: 1; display: flex; flex-direction: column; }
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; flex: 1; }
  #screen-end.active { flex: 1; justify-content: space-between; }
  #screen-game.active { flex: 1; justify-content: space-between; }

  /* ── INTRO ── */
  .intro-title-block {
    border-bottom: var(--border);
    padding: 28px 20px 24px;
  }

  .game-title {
    font-size: clamp(16px, 4.5vw, 22px);
    line-height: 1.7;
  }

  .game-title .inv {
    background: var(--black);
    color: var(--white);
    padding: 3px 7px;
    display: inline-block;
    margin-top: 6px;
  }

  .intro-body {
    border-bottom: var(--border);
    padding: 24px 20px;
    flex: 1;
  }

  .intro-text {
    font-family: 'VT323', monospace;
    font-size: 26px;
    line-height: 1.65;
    color: var(--gray3);
  }

  .intro-text span { display: block; margin-bottom: 4px; }

  .start-btn {
    display: block;
    width: 100%;
    background: var(--black);
    color: var(--white);
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 22px;
    cursor: crosshair;
    text-align: center;
    letter-spacing: 0.06em;
  }

  .start-btn:hover { background: var(--gray3); }

  /* ── GAME ── */
  .final-notice {
    font-family: 'VT323', monospace;
    font-size: 16px;
    padding: 9px 16px;
    border-bottom: var(--border);
    background: var(--black);
    color: var(--white);
    display: none;
    letter-spacing: 0.05em;
  }

  .final-notice.show { display: block; }

  .final-notice::before {
    content: '> ';
    animation: blink 0.9s steps(1) infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .car-prompt-block {
    border-bottom: var(--border);
    padding: 14px 20px;
  }

  .car-prompt { font-family: 'VT323', monospace; font-size: 20px; color: var(--gray2); margin-bottom: 2px; letter-spacing: 0.08em; }
  .prompt-question {
    font-family: 'VT323', monospace;
    font-size: 38px;
    color: var(--black);
    line-height: 1.15;
    letter-spacing: 0.02em;
  }

  .choice-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: var(--border);
  }

  .choice-btn {
    border: none;
    border-right: var(--border);
    background: var(--white);
    color: var(--black);
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 18px 16px 14px;
    cursor: crosshair;
    text-align: center;
    line-height: 1;
  }

  .choice-btn:last-child { border-right: none; }
  .choice-btn:hover { background: var(--gray1); }
  .choice-btn.pass:hover { background: var(--black); color: var(--white); }
  .choice-btn:disabled { opacity: 0.2; cursor: default; background: var(--white) !important; color: var(--black) !important; }

  .event-box {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ev-line {
    font-family: 'VT323', monospace;
    font-size: 26px;
    line-height: 1.35;
    color: var(--gray2);
    display: block;
    opacity: 0;
    transform: translateX(-5px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .ev-line.show { opacity: 1; transform: translateX(0); }

  .ev-line-mid { color: var(--black); }

  .ev-line-result { color: var(--black); font-weight: normal; }

  /* result category treatments on the result line */
  .ev-line-result.result-police { border-bottom: 3px solid var(--black); display: inline-block; }
  .ev-line-result.result-crash  { color: var(--white); background: var(--black); padding: 2px 8px; display: inline-block; }
  .ev-line-result.result-traffic { background: var(--gray1); padding: 2px 8px; display: inline-block; border: 2px solid var(--black); }

  .next-btn {
    display: block;
    flex: 1;
    background: none;
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 22px 20px;
    cursor: crosshair;
    text-align: center;
    color: var(--white);
    opacity: 0;
    pointer-events: none;
    letter-spacing: 0.04em;
    background: var(--black);
  }

  .next-btn::before { content: '>> '; }
  .next-btn.show { opacity: 1; pointer-events: all; }
  .next-btn:hover { background: var(--gray3); }

  .game-actions {
    display: grid;
    grid-template-columns: 1fr auto;
    border-top: var(--border);
  }

  .restart-btn {
    border: none;
    border-left: var(--border);
    background: var(--black);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 22px 14px;
    cursor: crosshair;
    color: var(--gray3);
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  .restart-btn:hover { background: var(--gray3); color: var(--white); }

  /* ── END ── */
  .ending-header {
    border-bottom: none;
    padding: 28px 20px 0;
  }

  .ending-icon { font-size: 32px; display: block; margin-bottom: 16px; }

  .ending-type { display: none; }

  .ending-title {
    font-family: 'VT323', monospace;
    font-size: 30px;
    line-height: 1.4;
    color: var(--black);
  }

  .ending-text-block {
    border-bottom: var(--border);
    padding: 0 20px 28px;
  }

  .ending-text {
    font-family: 'VT323', monospace;
    font-size: 30px;
    line-height: 1.4;
    color: var(--black);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: var(--border-thin);
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--gray3);
  }

  .stat-row:last-child { border-bottom: var(--border); }

  .stat-val {
    font-family: 'VT323', monospace;
    font-size: 30px;
    color: var(--black);
  }

  .replay-btn {
    display: block;
    width: 100%;
    background: var(--black);
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 24px;
    cursor: crosshair;
    text-align: center;
    color: var(--white);
    letter-spacing: 0.05em;
  }

  .replay-btn:hover { background: var(--gray3); }

  @keyframes pixelFlash {
    0%   { background: var(--black); }
    50%  { background: var(--gray1); }
    100% { background: var(--white); }
  }

  .event-box.flash { animation: pixelFlash 0.22s steps(2) forwards; }

  /* ── MOBILE ── */
  @media (max-width: 440px) {
    /* Remove desktop-only cursor */
    body, button { cursor: default; }

    /* Larger tap targets for choice buttons */
    .choice-btn { padding: 22px 16px 18px; font-size: 16px; }

    /* Bigger prompt */
    .prompt-question { font-size: 42px; }
    .car-prompt { font-size: 22px; }

    /* Bigger event text */
    .ev-line { font-size: 28px; }

    /* Bigger action bars */
    .next-btn { font-size: 12px; padding: 24px 20px; }
    .restart-btn { font-size: 8px; padding: 24px 16px; }
    .start-btn { font-size: 12px; padding: 26px; }
    .replay-btn { font-size: 12px; padding: 26px; }

    /* Bigger intro text */
    .intro-text { font-size: 28px; }
    .game-title { font-size: 18px; }

    /* Bigger ending */
    .ending-title { font-size: 32px; }
    .ending-text { font-size: 32px; }
    .stat-row { font-size: 24px; padding: 18px 20px; }
    .stat-val { font-size: 34px; }

    /* Round counter */
    .round-counter b { font-size: 13px; }
    .round-counter { font-size: 9px; }
  }
</style>

        <button class="next-btn" id="next-btn" onclick="nextRound()">

        </button>
        <button class="restart-btn" id="restart-btn" onclick="resetGame()">
          <span id="restart-lbl">↩ RESTART</span>
        </button>
      </div>
    </div>

    <!-- END -->
    <div class="screen" id="screen-end">
      <div class="ending-top">
        <div class="ending-header">
          <span class="ending-icon" id="ending-icon"></span>
          <div class="ending-type" id="ending-type"></div>
          <div class="ending-title" id="ending-title"></div>
        </div>
        <div class="ending-text-block">
          <div class="ending-text" id="ending-text"></div>
        </div>
      </div>
      <div class="ending-bottom">
        <div id="ending-stats"></div>
        <button class="replay-btn" id="replay-btn" onclick="resetGame()">
          <span id="replay-lbl">PLAY AGAIN</span>
        </button>
      </div>
    </div>

  </div>
</div>

  traffic: { icon:'🚧', te:'GRIDLOCK',    tz:'被堵',  tite:"You're not going anywhere.",   titz:'看起来你哪也去不了了。',      txte:"All you can do now is wait.\nWelcome to the LA freeway.", txtz:"你只能等着。\n欢迎来到洛杉矶高速。" }
};

let lang='en', round=1, passes=0, stays=0, waiting=false;

function getRoundProbs(ck, r, oc, sc) {
  let b;

  if(ck === 'pass') {
    // PASS: risk from police + crash + traffic, scales with round and pass count
    if(r<=7)       b={normal:.95, police:.02, crash:.02, traffic:.01};
    else if(r<=10) b={normal:.84, police:.06, crash:.06, traffic:.04};
    else if(r<=13) b={normal:.72, police:.10, crash:.10, traffic:.08};
    else           b={normal:.58, police:.14, crash:.16, traffic:.12};

    // Each past PASS stacks: +1.5% police, +2% crash (max 8 stacks)
    const e=Math.min(oc-1, 8); // oc already incremented, so -1
    if(e>0){ b.police+=e*.015; b.crash+=e*.02; b.normal-=e*.035; }

  } else {
    // STAY: no police. Only ambient crash + traffic risk (much lower)
    if(r<=7)       b={normal:.99, crash:.005, traffic:.005};
    else if(r<=10) b={normal:.95, crash:.03,  traffic:.02};
    else if(r<=13) b={normal:.88, crash:.07,  traffic:.05};
    else           b={normal:.78, crash:.13,  traffic:.09};

    // Each consecutive STAY reduces crash: -1% per stay (max 5 stacks)
    const s=Math.min(sc, 5);
    b.crash=Math.max(0, b.crash - s*.01);
    b.normal+=s*.01;
  }

  // Clamp negatives then normalise
  Object.keys(b).forEach(k => b[k]=Math.max(0, b[k]));
  const sum=Object.values(b).reduce((a,x)=>a+x,0);
  Object.keys(b).forEach(k=>b[k]/=sum);
  return b;
}

function pickCat(ck,r,oc,sc) {
  const p=getRoundProbs(ck,r,oc,sc); let c=0;
  const rnd=Math.random();
  for(const [k,v] of Object.entries(p)){c+=v;if(rnd<=c)return k;}
  return 'normal';
}

function pickEv(ck,cat) {
  const pool=EVENTS.filter(e=>e.choice_key===ck&&e.category===cat);
  if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  // fallback: no events for this choice+category combo, drop to normal
  const f=EVENTS.filter(e=>e.choice_key===ck&&e.category==='normal');
  return f[Math.floor(Math.random()*f.length)];
}

function pickCatAndEv(ck, r, oc, sc) {
  // Try up to 3 times to find a cat that has events for this choice_key
  for(let i=0;i<3;i++){
    const cat=pickCat(ck,r,oc,sc);
    const pool=EVENTS.filter(e=>e.choice_key===ck&&e.category===cat);
    if(pool.length) return {cat, ev:pool[Math.floor(Math.random()*pool.length)]};
  }
  // Final fallback: normal
  const f=EVENTS.filter(e=>e.choice_key===ck&&e.category==='normal');
  return {cat:'normal', ev:f[Math.floor(Math.random()*f.length)]};
}

function setLang(l) {
  lang=l;
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.getElementById('btn-zh').classList.toggle('active',l==='zh');
  applyLang();
}

function applyLang() {
  document.getElementById('intro-title').innerHTML = lang==='en'
    ? 'CAN YOU<br><span class="inv">PASS THIS CAR?</span>'
    : '这辆车<br><span class="inv">能不能超？</span>';
  document.getElementById('intro-text').innerHTML = INTRO[lang].map(s=>`<span>${s}</span>`).join('');
  document.getElementById('start-btn').textContent = lang==='en'?'START >>':'开始 >>';
  document.getElementById('car-prompt-lbl').textContent = lang==='en'?'CAR AHEAD':'前面有一辆车';
  document.getElementById('car-prompt-q').textContent   = lang==='en'?'PASS OR STAY?':'超还是不超？';
  document.getElementById('pass-lbl').textContent = lang==='en'?'PASS':'超';
  document.getElementById('stay-lbl').textContent = lang==='en'?'STAY':'不超';
  document.getElementById('next-lbl').textContent = lang==='en'?'NEXT CAR':'下一辆车';
  document.getElementById('restart-lbl').textContent = lang==='en'?'↩ RESTART':'↩ 重来一局';
  document.getElementById('replay-lbl').textContent = lang==='en'?'PLAY AGAIN':'再来一次';
  const fn=document.getElementById('final-notice');
  fn.textContent=fn.dataset[lang];
  document.getElementById('round-num').textContent=`${round} / 15`;
  document.getElementById('round-lbl').textContent=lang==='en'?'ROUND':'回合';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  round=1;passes=0;stays=0;waiting=false;
  document.getElementById('progress-fill').style.width='0%';
  clearBox(); resetBtns(); checkNotice();
  applyLang();
  showScreen('screen-game');
}

function resetGame(){
  round=1; passes=0; stays=0; waiting=false;
  document.getElementById('progress-fill').style.width='0%';
  applyLang();
  showScreen('screen-intro');
}

function clearBox(){
  [0,1,2].forEach(i=>{
    const el=document.getElementById('ev-val-'+i);
    el.classList.remove('show');
    el.textContent='';
  });
  document.getElementById('ev-val-2').className='ev-line ev-line-result';
  document.getElementById('next-btn').classList.remove('show');
}

function resetBtns(){
  document.getElementById('btn-pass').disabled=false;
  document.getElementById('btn-stay').disabled=false;
}

function checkNotice(){
  const fn=document.getElementById('final-notice');
  fn.textContent=fn.dataset[lang];
  fn.classList.toggle('show',round===15);
}

function makeChoice(ck){
  if(waiting)return;
  waiting=true;
  document.getElementById('btn-pass').disabled=true;
  document.getElementById('btn-stay').disabled=true;
  if(ck==='pass') { passes++; stays=0; } else { stays++; }

  const {cat,ev}=pickCatAndEv(ck,round,passes,stays);

  const box=document.getElementById('event-box');
  box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');

  document.getElementById('ev-val-0').textContent = lang==='en'?ev.choice_en:ev.choice_zh;
  document.getElementById('ev-val-1').textContent = lang==='en'?ev.event_en:ev.event_zh;
  document.getElementById('ev-val-2').textContent = lang==='en'?ev.result_en:ev.result_zh;
  document.getElementById('ev-val-2').className=`ev-line ev-line-result result-${cat}`;

  setTimeout(()=>document.getElementById('ev-val-0').classList.add('show'),80);
  setTimeout(()=>document.getElementById('ev-val-1').classList.add('show'),260);
  setTimeout(()=>document.getElementById('ev-val-2').classList.add('show'),480);

  const over=cat!=='normal';
  if(over) setTimeout(()=>endGame(cat),1300);
  else if(round>=15) setTimeout(()=>endGame('arrive'),1300);
  else setTimeout(()=>document.getElementById('next-btn').classList.add('show'),800);
}

function nextRound(){
  round++;
  waiting=false;
  document.getElementById('progress-fill').style.width=((round-1)/15*100)+'%';
  document.getElementById('round-num').textContent=`${round} / 15`;
  clearBox(); resetBtns(); checkNotice();
}

function endGame(type){
  const e=ENDS[type]||ENDS.arrive;
  document.getElementById('ending-icon').textContent=e.icon;
  document.getElementById('ending-type').textContent=lang==='en'?e.te:e.tz;
  document.getElementById('ending-title').textContent=lang==='en'?e.tite:e.titz;
  document.getElementById('ending-text').innerHTML=(lang==='en'?e.txte:e.txtz).replace(/\n/g,'<br>');
  const s=document.getElementById('ending-stats');
  s.innerHTML = lang==='en'
    ? `<div class="stat-row"><span class="stat-key">CARS PASSED</span><span class="stat-val">${passes}</span></div><div class="stat-row"><span class="stat-key">ROUNDS COMPLETED</span><span class="stat-val">${round} / 15</span></div>`
    : `<div class="stat-row"><span class="stat-key">超车次数</span><span class="stat-val">${passes}</span></div><div class="stat-row"><span class="stat-key">完成回合</span><span class="stat-val">${round} / 15</span></div>`;
  showScreen('screen-end');
}

applyLang();
</script>
</body>
</html>
